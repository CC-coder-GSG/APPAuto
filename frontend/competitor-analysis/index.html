/* ===== V2: top modules + expandable matrix + restrained color system ===== */
:root{
  --blue-50:#eff6ff;--cyan-50:#ecfeff;--amber-50:#fffbeb;--violet-50:#f5f3ff;
  --green-50:#ecfdf5;--rose-50:#fff1f2;--slate-50:#f8fafc;
}
.topbar{height:64px}
.page-tabs{position:sticky;top:64px;z-index:45;height:52px;background:rgba(248,250,252,.96);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:end;gap:4px;padding:0 24px}
.page-tab{height:42px;border:0;background:transparent;border-radius:10px 10px 0 0;padding:0 18px;color:#667085;font-weight:650;position:relative}
.page-tab:hover{background:#fff;color:#344054}.page-tab.active{background:#fff;color:var(--primary)}
.page-tab.active:after{content:'';position:absolute;left:14px;right:14px;bottom:0;height:3px;border-radius:3px 3px 0 0;background:var(--primary)}
.shell{grid-template-columns:minmax(0,1fr);min-height:calc(100vh - 116px)}
.sidebar{display:none;top:116px;height:calc(100vh - 116px)}
.app.topic-mode .shell{grid-template-columns:238px minmax(0,1fr)}
.app.topic-mode .sidebar{display:block}
.main{padding-top:24px}
.nav-title.topic-title{font-size:12px;text-transform:none;letter-spacing:0;color:#475467;font-weight:700;padding-top:4px}
.topic-nav-note{font-size:11px;color:#98a2b3;padding:0 10px 10px;white-space:normal}

/* restrained color hierarchy */
.stat{position:relative;overflow:hidden}.stat:before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:#cbd5e1}
.stat:nth-child(1):before{background:#3b82f6}.stat:nth-child(2):before{background:#14b8a6}.stat:nth-child(3):before{background:#10b981}.stat:nth-child(4):before{background:#f59e0b}.stat:nth-child(5):before{background:#8b5cf6}
.panel-head{background:linear-gradient(180deg,#fff,#fbfcfe)}
.software-head{font-weight:700}.software-head .swatch{width:10px;height:10px;box-shadow:0 0 0 3px rgba(148,163,184,.12)}
.compare-table thead th{background:#f8fafc}
.feature-summary-row:hover td{background:#fbfdff}
.feature-summary-row td{transition:.12s background}
.feature-toggle{display:flex;align-items:center;gap:8px;width:100%;border:0;background:transparent;padding:0;text-align:left;font-weight:750;color:#1f2937}
.chevron{width:22px;height:22px;border-radius:6px;background:#f1f5f9;display:inline-flex;align-items:center;justify-content:center;font-size:12px;color:#64748b;transition:.16s}
.feature-toggle.open .chevron{transform:rotate(90deg);background:#dbeafe;color:#2563eb}
.summary-cell{min-width:190px}.summary-line{margin-top:7px;color:#475467;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.45}.summary-more{display:inline-block;margin-top:5px;font-size:11px;color:#94a3b8}
.software-summary{border-left:3px solid transparent;padding-left:9px;min-height:62px}
.feature-detail-row>td{padding:0!important;background:#f8fafc;border-bottom:1px solid #dbe3ee!important}
.feature-detail{padding:18px 20px 22px;border-top:1px solid #edf2f7}
.detail-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.detail-title h4{margin:0;font-size:15px}.detail-hint{font-size:12px;color:#94a3b8}
.detail-table{background:#fff}.detail-table th{border-top:3px solid var(--soft-color,#cbd5e1)}
.detail-analysis{margin-top:14px;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px;align-items:start}
.inline-analysis,.inline-conclusion{background:#fff;border:1px solid var(--line);border-radius:12px;padding:15px 16px}
.inline-analysis h4,.inline-conclusion h4{margin:0 0 10px;font-size:14px}.inline-conclusion{border-top:3px solid #8b5cf6}
.matrix-legend{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;color:#667085;font-size:12px}.legend-item{display:flex;align-items:center;gap:5px}
.matrix-actions{display:flex;gap:7px;flex-wrap:wrap}
.section-accent-blue{border-top:3px solid #3b82f6}.section-accent-green{border-top:3px solid #10b981}.section-accent-amber{border-top:3px solid #f59e0b}.section-accent-violet{border-top:3px solid #8b5cf6}
.conclusion-card{top:132px}

@media(max-width:1100px){.app.topic-mode .shell{grid-template-columns:205px minmax(0,1fr)}.detail-analysis{grid-template-columns:1fr}.inline-conclusion{border-top:3px solid #8b5cf6}}
@media(max-width:760px){.topbar{height:auto}.page-tabs{position:sticky;top:62px;height:48px;padding:0 8px;overflow:auto;align-items:center}.page-tab{white-space:nowrap;height:36px;padding:0 12px;border-radius:8px}.page-tab.active:after{display:none}.app.topic-mode .shell{display:block}.app.topic-mode .sidebar{display:block;position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:7px 8px;white-space:nowrap;overflow:auto}.app.topic-mode .feature-nav{display:flex;gap:5px;max-height:none}.app.topic-mode .feature-nav .nav-item{width:auto;display:inline-flex;flex:0 0 auto}.topic-title,.topic-nav-note{display:none}.summary-cell{min-width:160px}.detail-analysis{grid-template-columns:1fr}}


/* ===== V3: centered composition + compact matrix overview ===== */
:root{
  --content-max:1600px;
  --rating-strong-bg:#eef4ff;--rating-strong-fg:#1d4ed8;--rating-strong-bd:#c7d7fe;
  --rating-good-bg:#edf8f3;--rating-good-fg:#047857;--rating-good-bd:#c9eadb;
  --rating-ok-bg:#f4f7fb;--rating-ok-fg:#475467;--rating-ok-bd:#dde3ec;
  --rating-improve-bg:#fff7e8;--rating-improve-fg:#b45309;--rating-improve-bd:#f6dfb5;
  --rating-none-bg:#fff1f2;--rating-none-fg:#b42318;--rating-none-bd:#ffd4d8;
  --rating-unknown-bg:#f5f6f8;--rating-unknown-fg:#667085;--rating-unknown-bd:#e4e7ec;
}
.topbar{
  padding-left:max(24px,calc((100vw - var(--content-max))/2));
  padding-right:max(24px,calc((100vw - var(--content-max))/2));
}
.page-tabs{
  justify-content:center;
  padding-left:max(24px,calc((100vw - var(--content-max))/2));
  padding-right:max(24px,calc((100vw - var(--content-max))/2));
}
.shell{width:min(100%,1680px);margin:0 auto}
.main{width:100%;max-width:var(--content-max);margin:0 auto;padding:28px 28px 64px}
.app.topic-mode .main{max-width:none}
.hero{padding:0 2px}.hero h2{letter-spacing:-.02em}
.panel{overflow:hidden}
.matrix-table .feature-cell{width:190px;min-width:190px;vertical-align:middle}
.matrix-table .summary-cell{min-width:170px;vertical-align:middle;text-align:center;padding:16px 12px}
.feature-summary-row{height:76px}
.feature-summary-row:hover td{background:#fafcff}
.software-summary{border-left:0!important;background:transparent!important;min-height:0;padding:0;display:flex;align-items:center;justify-content:center}
.overview-rating{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-width:92px;padding:7px 12px;border:1px solid transparent;border-radius:999px;font-size:13px;font-weight:700;line-height:1;white-space:nowrap}
.overview-rating:before{content:'';width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.82}
.rating-strong{background:var(--rating-strong-bg);color:var(--rating-strong-fg);border-color:var(--rating-strong-bd)}
.rating-good{background:var(--rating-good-bg);color:var(--rating-good-fg);border-color:var(--rating-good-bd)}
.rating-ok{background:var(--rating-ok-bg);color:var(--rating-ok-fg);border-color:var(--rating-ok-bd)}
.rating-improve{background:var(--rating-improve-bg);color:var(--rating-improve-fg);border-color:var(--rating-improve-bd)}
.rating-none{background:var(--rating-none-bg);color:var(--rating-none-fg);border-color:var(--rating-none-bd)}
.rating-unknown{background:var(--rating-unknown-bg);color:var(--rating-unknown-fg);border-color:var(--rating-unknown-bd)}
.matrix-legend{justify-content:center;padding:2px 0 4px;gap:12px 18px}
.matrix-legend .overview-rating{min-width:auto;padding:5px 9px;font-size:11px}
.feature-toggle{justify-content:flex-start}.feature-toggle .chevron{flex:0 0 auto}
.feature-focus{display:inline-flex;align-items:center;margin:7px 0 0 30px;padding:2px 7px;border-radius:999px;background:#eef4ff;color:#3561c9;font-size:10px;font-weight:650}
.detail-table .compare-table td{min-width:220px}
@media(min-width:1700px){.main{padding-left:0;padding-right:0}}
@media(max-width:1100px){.main{padding:24px 20px 56px}.topbar,.page-tabs{padding-left:18px;padding-right:18px}.page-tabs{justify-content:flex-start}}
@media(max-width:760px){.main{padding:16px 12px 40px}.topbar,.page-tabs{padding-left:12px;padding-right:12px}.matrix-table .feature-cell{width:150px;min-width:150px}.matrix-table .summary-cell{min-width:130px}.overview-rating{min-width:84px;padding:6px 9px;font-size:12px}.feature-focus{display:none}}


/* ===== V4: analysis workspace polish + aligned details + rich editing ===== */
:root{--topic-side:270px;--content-gap:24px}
/* polished top module switcher */
.page-tabs{height:66px;align-items:center;gap:8px;background:rgba(246,248,251,.94);border-bottom:1px solid #e8edf4;padding-top:8px;padding-bottom:8px}
.page-tab{height:42px;border:1px solid transparent;border-radius:12px;padding:0 20px;background:transparent;color:#667085;font-weight:700;letter-spacing:.01em;transition:.16s ease}
.page-tab:hover{background:#fff;border-color:#e4e9f1;color:#344054;box-shadow:0 4px 14px rgba(16,24,40,.04)}
.page-tab.active{background:#fff;color:#2458d3;border-color:#dbe5f5;box-shadow:0 7px 20px rgba(37,99,235,.09)}
.page-tab.active:after{left:22px;right:22px;bottom:-1px;height:3px;background:#2f6fed}
/* topic workspace: centered sidebar with real gutter */
.app.topic-mode .shell{grid-template-columns:var(--topic-side) minmax(0,1fr);gap:var(--content-gap);padding:24px 28px 64px;align-items:start}
.app.topic-mode .sidebar{display:block;position:sticky;top:142px;height:auto;max-height:calc(100vh - 166px);padding:0;background:transparent;border:0;overflow:visible}
.app.topic-mode .main{padding:0;max-width:none;min-width:0}
.topic-nav-card{margin:0;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:14px}

进入工具进行处理，测量与计算流程相对分离。", "测地通在当前点测量页面提供快捷设置，方便在作业过程中临时调整相关参数。但对于坐标参数、图层等可修改设置，如果需要在单次作业中频繁调整，目前操作仍相对繁琐，需点击进入对应设置页面。\n后续可考虑将部分高频参数的设置入口应用到其他页面。例如输入角度时，可通过快捷入口快速修改角度输入格式；调出方式可考虑增加显现按钮、右滑手势或快捷键等，使临时参数调整更加快捷。"], "judgement": "已有能力优化", "reasons": ["基础能力差距小", "重点关注快捷设置、特殊点发现性、防错信息"]}, {"id": "t2", "index": 2, "name": "坐标点库", "sourceFeatures": ["f1"], "analysis": ["**“排序/筛选 → 多选 → 直接导出”链路不完整**：当前 SM 不支持点位排序，导出需退出点库后操作，导出筛选状态下也无法直接查看点详情，且无法导出不满足筛选条件的点组合。相比之下，筛选、多选与导出之间缺少连续操作能力，批量处理点数据时操作步骤较多。", "**点信息查看效率较低**：当前单行模式需逐点滑动查看完整信息，多行模式又仅展示 NEZ 或 BLH 等有限字段，无法同时快速浏览多个点的主要属性。可考虑增加信息更集中的列表样式，如左右分栏展示点名与坐标、编码等关键信息。", "**两点计算入口较深**：当前无法在点库中直接选择两个点进行反算，需要退出点库进入工具中的 CGCO 功能，再重新输入或选择点位。点库与点计算功能之间关联较弱，可考虑支持选中两点后直接进入反算，提高常用计算的操作效率。", "**查看方式切换操作层级较深**：当前需通过“更多 → 显示方式”切换列表样式，切换坐标显示类型时还需再次操作。对于频繁查看不同点信息的场景，可增加更直接的快捷切换入口，减少重复操作。"], "judgement": "优先体验优化", "reasons": ["高频使用", "直接导出、排序、反算等改进价值清晰"]}, {"id": "t3", "index": 3, "name": "CAD", "sourceFeatures": ["f3"], "analysis": ["CAD 是 Survey Master 当前相对成熟的模块，主要差距不是“能不能打开 CAD”，而是现场围绕图纸能否连续完成 **找对象、识别对象、计算、编辑、放样和成果保存**。", "Survey Master 选中对象后再显示炸开、反向、属性等相关操作，可以减少长期占据界面的无关按钮，属于值得保留的上下文交互；", "测地通的长度、角度、面积和格网工具，更偏向减少用户在 CAD 与工具模块、电脑端之间来回切换。\n后续更适合选择性补充真正高频的现场工具，而不是以“工具数量最多”为目标，重点应放在 **大图流畅性、图层与对象操作效率、CAD 到放样的连续性，以及常见异常图纸的处理能力**。"], "judgement": "保持优势并选择性增强", "reasons": ["当前基础较强", "重点补现场高频计算、图纸处理、流畅性", "不宜单纯追求工具数量"]}, {"id": "t4", "index": 4, "name": "面放样", "sourceFeatures": ["f4"], "analysis": ["Survey Master 当前在设计面选择、临时调整设计高以及填方/挖方状态根据颜色区分展示较为直观，能够满足常规面放样需求；但在设计面需要现场修正时，编辑能力相对较弱。", "测地通和智享版工程之星提供三角网编辑、过滤、重构等功能，当现场发现异常三角形、边界连接问题或需要根据实测结果调整表面时，可以直接对 TIN 进行处理，减少返回内业重新处理数据的情况。", "后续可在保持现有面放样流程简洁、设计面切换方便的基础上，补充常用的三角网编辑、过滤和重构能力，使用户既能快速完成日常放样，也能应对现场临时修改设计面的场景。"], "judgement": "继续观察专业深度需求", "reasons": ["TIN 编辑能力有差异", "是否值得增强取决于现场改面的真实频率"]}, {"id": "t5", "index": 5, "name": "基坑放样", "sourceFeatures": ["f6"], "analysis": ["**Survey Master 当前基坑功能整体已经比较完善，并且相对竞品具有明显优势。**", "当前面文件主要还是平面型设计，后续如果支持**具有高程起伏的复杂设计面**，基坑模型会更接近实际工程。", "当前填挖计算主要对应单一设计面；复杂设计面下如果能够同时分析填、挖区域，并与土方计算进一步结合，可以从单纯“放样工具”扩展到**施工前方案判断和工程量参考**。", "当前基坑能够导出 XML，再到面放样中查看和使用三角网，但流程还有跳转；如果在**基坑详情中直接提供 3D 模型查看、编辑和剖面分析**，构建和现场修改会更加直观。"], "judgement": "已有明显优势，建议继续深化", "reasons": ["核心能力较完整，测地通已有的主要基坑放样能力 Survey Master 基本已覆盖，且智享工程之星、Hi-Survey 暂不支持", "自动填挖计算、2D/3D面积、负偏距灵活处理、成果导出及与面放样联动，已经形成较完整的作业闭环", "后续重点不在补齐竞品，而在支持**复杂起伏设计面、多填挖区域分析、基坑与土方计算联动**", "可进一步增强**基坑详情中的3D模型查看、编辑及剖面分析**，降低现场理解和调整复杂模型的成本"]}, {"id": "t6", "index": 6, "name": "视频 / 实景 / 影像测量", "sourceFeatures": ["f17"], "analysis": ["测地通的“视觉测量”、智享版工程之星的“实景测量”和 Hi-Survey 的“影像测量”名称不同，但实现思路较为接近，都是通过现场采集影像并完成解算后，再从影像中选择目标点获取坐标，类似摄影测量中的后处理选点。", "这类方式比较适合**目标点难以直接到达**，以及**现场需要密集采集多个点**的场景。一次完成影像采集后，可在后续处理中连续选取多个目标点，能够减少逐点到达、逐点测量的外业工作量。", "Survey Master 当前对于难以直接到达的目标主要通过激光测量解决，但激光测量容易受到目标物体反射强度的影响，同时手持测量过程中晃动也会影响瞄准和测量稳定性，在部分场景下存在一定限制。", "后续可考虑增加基于视频或影像的选点测量方式，作为现有激光测量的补充。当前三家选点只支持一次选择一个点，可参考摄影测量，一次提取较多特征点。"], "judgement": "建议重点规划", "reasons": ["实用场景明确", "可解决不可达、危险、批量点问题", "主要竞品均已布局"]}, {"id": "t7", "index": 7, "name": "账号登录与云端协同", "sourceFeatures": ["f18", "f19"], "analysis": ["**账号登录核心价值在于项目数据能够跨设备、跨人员流转。** 测地通、工程之星和 Hi-Survey 都是以账号为入口，将项目备份、数据同步、项目传递或多人协作串联起来，减少项目数据依赖单一手簿本地保存的问题。", "**Survey Master 当前注册、授权与设备绑定较强，但缺少面向项目数据的账号体系。** 当更换手簿、多人参与同一项目或需要在内外业之间传递数据时，仍主要依赖文件导入导出，项目延续性和数据管理相对不便。", "**竞品在云端应用方向上有所区别，但都围绕“项目”展开。** 测地通和工程之星更强调多人共享、协同采集；Hi-Survey 更偏向项目上传、下载和内外业数据传递。说明云端能力不一定要直接做到复杂的实时协同，项目备份、同步和传递本身就具有较高的实际价值。", "**Survey Master 后续可优先建立“账号—设备—项目—数据”的基本关联。** 先解决项目备份、换机恢复、跨设备同步及项目传递等高频需求，再根据实际使用场景扩展多人共享、权限管理和协同采集，避免一开始就将云端功能做得过重。"], "judgement": "先梳理基础体系，再规划协同", "reasons": ["协同有团队场景价值", "与当前注册、设备授权方式关系紧密", "需要先明确用户、设备、项目和数据关系"]}, {"id": "t8", "index": 8, "name": "视频教程与 AI 助手", "sourceFeatures": ["f24", "f26"], "analysis": ["**视频教程已经属于较成熟的基础能力，差异主要体现在查找和使用效率上。** Survey Master 已覆盖主要产品模块，但测地通支持搜索、分类以及在其他页面悬浮查看，更方便用户在实际操作过程中快速找到对应教程。后续可重点优化教程搜索、分类及从当前功能页面直接进入相关教程的能力。", "**AI 助手相比视频教程，更适合解决“当前正在遇到的问题”。** 用户在现场作业时往往不是需要完整学习某项功能，而是希望快速知道“下一步怎么操作”“某个参数是什么意思”“当前异常该怎么处理”。因此 AI 助手更适合作为即时操作指导和问题查询入口，与视频教程形成互补。", "**智享版工程之星的 AI 已开始与软件实际操作结合。** 除知识问答外，还支持通过语音完成连接仪器、新建工程、测量、放样等操作，相比单纯的聊天问答更贴近现场使用场景。Survey Master 后续如果增加 AI，可重点考虑软件操作引导、页面跳转、语音控制等与现有功能直接关联的能力。", "**当前竞品 AI 能力仍有明显提升空间。** 例如测地通和工程之星均不保存聊天记录及上下文，连续追问能力有限；部分回答也仍以通用操作步骤或较长文字说明为主。后续如果 Survey Master 引入 AI，可结合软件自身功能、当前页面和设备状态，提供更有针对性的操作说明、异常排查及相关教程推荐，而不只是增加一个独立的聊天入口。"], "judgement": "持续优化", "reasons": ["视频已经成熟", "AI 仍处于早期", "更适合向专业问答、操作引导和故障诊断发展"]}, {"id": "t9", "index": 9, "name": "无网测量", "sourceFeatures": ["f16"], "analysis": ["**无网测量主要解决无 CORS、通信困难且不方便架设基站的场景**，具有一定实际价值。测地通和智享版工程之星都已经提供类似能力，但使用场景相对受限，并不能替代常规 RTK 作业。", "**这类方式最大的局限在于结果无法现场立即确认。** 测量时需要先记录观测数据，之后再进行解算，其中测地通当前约 2 小时后解算，工程之星在获得差分数据约 5 分钟后解算。相比 RTK 实时获得固定解，用户无法在现场马上确认最终坐标是否可靠，存在离开现场后才发现数据异常、需要返工的风险。", "**Survey Master 当前虽然不支持后续解算式无网测量，但已有电台 RTK、静态/PPK 等无公网作业方式。** 对于大多数无网场景已有一定替代方案，因此是否增加该功能，需要结合实际客户场景和使用频率判断。", "**无网测量并不是简单增加一个测量入口。** 后续还涉及原始观测数据管理、数据上传、云端解算、结果返回及异常处理等完整流程，开发和服务成本相对较高。现阶段更适合作为特殊无网场景的补充能力，根据客户需求和使用频率再评估优先级。"], "judgement": "保留关注，暂不高优先级", "reasons": ["特殊场景有价值", "现场结果不确定", "研发和服务链路较重", "电台 RTK、静态/PPK 等替代方案成熟"]}], "followups": [{"title": "道路放样", "text": "重点比较道路数据建立、导入、横断面、边坡、锥坡和现场修改效率；"}, {"title": "光伏放样", "text": "重点比较山地/平地场景划分、首尾桩建立方式、参数调整和批量放样效率；"}, {"title": "图层管理", "text": "判断是否需要从设置/CAD 中提升为更直接的项目级入口；"}, {"title": "影像图库", "text": "若视频测量进入规划，应同步研究影像的统一查看、编辑、删除、关联点和成果追溯；"}, {"title": "行业专项功能", "text": "铁路、电力、河道、林业等应结合目标客户群再决定是否进一步投入对比。"}], "updatedAt": null};
let state = JSON.parse(JSON.stringify(INITIAL_DATA));
normalizeBuiltins(state);
let editMode = false;
let currentView = {type:'dashboard', id:null};
let undoStack=[], redoStack=[];
let filters={q:'', onlyDiff:false, softwareIds:new Set(state.softwares.map(s=>s.id)), conclusion:'all'};
let topicNavFilter={q:'',group:'all'};
let expandedFeatures=new Set();
let conclusionSort={key:null,dir:'asc'};
let modalSaveHandler=null;

// 平台接入层：页面不再直接使用 localStorage，数据由 OmniQA 统一保存。
// 管理员只需要实现 platform-adapter.js 中的接口，UI 与业务逻辑无需修改。
let platformMeta={connected:false,version:null,user:null,updatedAt:null,updatedBy:null};
let remoteSaveTimer=null,remoteSaving=false,remoteDirty=false,lastRemoteCheck=0;
const DataService={
  get adapter(){return window.CompetitorPlatformAdapter||null},
  async init(){
    const a=this.adapter;
    if(!a||typeof a.isConfigured!=='function'||!a.isConfigured())return {connected:false};
    let user=null;
    try{if(typeof a.getCurrentUser==='function')user=await a.getCurrentUser()}catch(e){console.warn('getCurrentUser failed',e)}
    return {connected:true,user};
  },
  async load(){
    const a=this.adapter;if(!a||typeof a.loadReport!=='function')return null;
    return await a.loadReport();
  },
  async save(data,baseVersion){
    const a=this.adapter;if(!a||typeof a.saveReport!=='function')throw new Error('平台未提供 saveReport');
    return await a.saveReport({data,baseVersion});
  }
};

function clone(o){return JSON.parse(JSON.stringify(o))}
function normalizeBuiltins(d){const colors={sm:'#2563eb',ls:'#d97706',es:'#0891b2',hs:'#7c3aed'};(d.softwares||[]).forEach(x=>{if(colors[x.id])x.color=colors[x.id]});d.topics=d.topics||[];d.topics.forEach(t=>{if(typeof t.isFocus!=='boolean')t.isFocus=true;t.sourceFeatures=Array.isArray(t.sourceFeatures)?t.sourceFeatures:[];t.analysis=Array.isArray(t.analysis)?t.analysis:[];t.reasons=Array.isArray(t.reasons)?t.reasons:[];t.judgement=t.judgement||'';if(Array.isArray(t.relatedFeatures))t.relatedFeatures=[...new Set(t.relatedFeatures)].filter(Boolean);if(typeof t.relatedManual!=='boolean')t.relatedManual=false;if(!['p0','p1','p2','p3'].includes(t.importance)){const j=t.judgement||'';t.importance=/重点规划|基础体系|体系|规划协同/.test(j)?'p0':/暂不|低优先级/.test(j)?'p3':/优化|优势|持续/.test(j)?'p1':'p2'}})}
function focusTopics(){return (state.topics||[]).filter(t=>t.isFocus!==false)}
function topicForFeature(fid){return (state.topics||[]).find(t=>(t.sourceFeatures||[]).includes(fid))}
function ensureTopicForFeature(s,fid,makeFocus=false){let t=(s.topics||[]).find(x=>(x.sourceFeatures||[]).includes(fid));if(!t){const f=(s.features||[]).find(x=>x.id===fid);if(!f)return null;const maxIndex=(s.topics||[]).reduce((m,x)=>Math.max(m,Number(x.index)||0),0);let id=`analysis_${fid}`;let n=2;while((s.topics||[]).some(x=>x.id===id))id=`analysis_${fid}_${n++}`;t={id,index:maxIndex+1,name:f.name,sourceFeatures:[fid],analysis:[],judgement:'',reasons:[],importance:'p2',isFocus:!!makeFocus,auto:true};s.topics.push(t)}else if(makeFocus)t.isFocus=true;return t}
function setFeatureFocus(fid,on){transact(s=>{const t=ensureTopicForFeature(s,fid,on);if(t)t.isFocus=!!on},on?'已加入重点分析':'已取消重点分析')}
function goToFeatureInMatrix(fid){filters.q='';filters.onlyDiff=false;expandedFeatures.add(fid);currentView={type:'features',id:null};render();requestAnimationFrame(()=>{document.querySelector(`[data-feature-row="${fid}"]`)?.scrollIntoView({behavior:'smooth',block:'center'})})}

function syncLabel(prefix='已同步'){const name=platformMeta.user?.name||platformMeta.user?.displayName||platformMeta.user?.username||'';return name?`${prefix} · ${name}`:prefix}
async function bootstrap(){
  setSyncState('正在连接平台…');
  try{
    const init=await DataService.init();platformMeta.connected=!!init.connected;platformMeta.user=init.user||null;
    if(platformMeta.connected){
      const remote=await DataService.load();
      if(remote&&remote.data&&remote.data.features&&remote.data.softwares){
        state=remote.data;normalizeBuiltins(state);
        platformMeta.version=remote.version??remote.data.version??null;
        platformMeta.updatedAt=remote.updatedAt||remote.data.updatedAt||null;
        platformMeta.updatedBy=remote.updatedBy||null;
      }
      setSyncState(syncLabel(remote&&remote.data?'已同步':'平台已连接'));
    }else{
      setSyncState('平台未接入 · 当前会话');
    }
  }catch(e){
    console.error('Platform bootstrap failed',e);platformMeta.connected=false;setSyncState('平台连接失败 · 当前会话');
  }
  filters.softwareIds=new Set(state.softwares.map(s=>s.id));updateUndoRedo();render();

function persist(){
  state.updatedAt=new Date().toISOString();remoteDirty=true;
  if(!platformMeta.connected){setSyncState('平台未接入 · 当前会话');return}
  setSyncState('等待同步…');clearTimeout(remoteSaveTimer);remoteSaveTimer=setTimeout(flushRemoteSave,350);
}
async function flushRemoteSave(){
  if(!platformMeta.connected||remoteSaving||!remoteDirty)return;
  remoteSaving=true;remoteDirty=false;setSyncState('正在同步…');
  const snapshot=clone(state),baseVersion=platformMeta.version;
  try{
    const res=await DataService.save(snapshot,baseVersion);
    platformMeta.version=res?.version??platformMeta.version;
    platformMeta.updatedAt=res?.updatedAt||new Date().toISOString();
    platformMeta.updatedBy=res?.updatedBy||platformMeta.user?.name||null;
    setSyncState(syncLabel('已同步'));
  }catch(e){
    console.error('Remote save failed',e);remoteDirty=true;
    if(e&&(e.status===409||e.code==='CONFLICT'))setSyncState('发现协同冲突 · 请刷新');
    else setSyncState('同步失败 · 改动未上传');

    remoteSaving=false;if(remoteDirty&&platformMeta.connected)remoteSaveTimer=setTimeout(flushRemoteSave,1200);

async function checkRemoteUpdates(){
  if(!platformMeta.connected||editMode||remoteSaving||remoteDirty)return;
  const now=Date.now();if(now-lastRemoteCheck<10000)return;lastRemoteCheck=now;
  try{
    const remote=await DataService.load();if(!remote||!remote.data||!remote.data.features)return;
    const rv=remote.version??remote.data.version??remote.updatedAt??null;
    if(rv&&platformMeta.version&&String(rv)===String(platformMeta.version))return;
    const remoteStamp=remote.updatedAt||remote.data.updatedAt||'',localStamp=state.updatedAt||'';
    if(!rv&&remoteStamp&&localStamp&&remoteStamp<=localStamp)return;
    state=remote.data;normalizeBuiltins(state);
    platformMeta.version=rv;platformMeta.updatedAt=remote.updatedAt||null;platformMeta.updatedBy=remote.updatedBy||null;
    filters.softwareIds=new Set(state.softwares.map(s=>s.id));undoStack=[];redoStack=[];updateUndoRedo();render();

  }catch(e){console.warn('Remote refresh skipped',e)}
}

let richSavedRange=null,richActiveEditor=null;
function saveRichRange(el){const sel=window.getSelection();if(sel&&sel.rangeCount&&el&&el.contains(sel.anchorNode)){richSavedRange=sel.getRangeAt(0).cloneRange();richActiveEditor=el}}
function restoreRichRange(){const el=richActiveEditor;if(!el)return null;el.focus();if(richSavedRange){const sel=window.getSelection();sel.removeAllRanges();sel.addRange(richSavedRange)}return el}
function bindRichEditors(){document.querySelectorAll('.rich-editor[data-rich]').forEach(el=>{el.onfocus=()=>saveRichRange(el);el.onkeyup=()=>saveRichRange(el);el.onmouseup=()=>saveRichRange(el);el.oninput=()=>saveRichRange(el);el.onblur=()=>setTimeout(()=>{if(document.activeElement&&document.activeElement.closest?.('#globalRichToolbar'))return;commitRich(el)},0)});document.onselectionchange=()=>{const sel=window.getSelection();if(!sel||!sel.rangeCount)return;const n=sel.anchorNode;const el=(n?.nodeType===1?n:n?.parentElement)?.closest?.('.rich-editor[data-rich]');if(el&&el.contains(sel.focusNode))saveRichRange(el)}}
function runRichCommand(cmd,value=null){const el=restoreRichRange();if(!el)return;try{document.execCommand('styleWithCSS',false,true)}catch(e){}document.execCommand(cmd,false,value);saveRichRange(el)}
function bindGlobalRichToolbar(){document.querySelectorAll('[data-global-cmd]').forEach(b=>{b.onpointerdown=e=>{e.preventDefault();runRichCommand(b.dataset.globalCmd)}});document.querySelectorAll('[data-global-format]').forEach(b=>{b.onpointerdown=e=>{e.preventDefault();runRichCommand('formatBlock',b.dataset.globalFormat)}});const tc=document.getElementById('globalTextColor');if(tc){tc.onpointerdown=()=>{if(richActiveEditor)saveRichRange(richActiveEditor)};tc.onchange=()=>runRichCommand('foreColor',tc.value)}const hc=document.getElementById('globalHighlightColor');if(hc){hc.onpointerdown=()=>{if(richActiveEditor)saveRichRange(richActiveEditor)};hc.onchange=()=>runRichCommand('hiliteColor',hc.value)}const link=document.querySelector('[data-global-link]');if(link){link.onpointerdown=e=>{e.preventDefault();const el=restoreRichRange();if(!el)return;const url=prompt('输入链接地址（https://…）');if(url)runRichCommand('createLink',url)}}}
function commitRich(el){const key=el.dataset.rich;const html=sanitizeRichHtml(el.innerHTML).replace(/^(<br>)+|(<br>)+$/g,'');const parts=key.split('|');if(parts[0]==='factblock'){const [,fid,sid]=parts;const f=state.features.find(x=>x.id===fid);const old=collectionHtml(f?.facts?.[sid]||[],'ul');if(sanitizeRichHtml(old)===html)return;transact(s=>{s.features.find(x=>x.id===fid).facts[sid]=html?[html]:[]},'已修改功能事实')}else if(parts[0]==='analysisblock'){const [,tid]=parts;const t=state.topics.find(x=>x.id===tid);const old=collectionHtml(t?.analysis||[],'ol');if(sanitizeRichHtml(old)===html)return;transact(s=>{const x=s.topics.find(x=>x.id===tid);if(x)x.analysis=html?[html]:[]},'已修改分析')}else if(parts[0]==='reasonblock'){const [,tid]=parts;const t=state.topics.find(x=>x.id===tid);const old=collectionHtml(t?.reasons||[],'ul');if(sanitizeRichHtml(old)===html)return;transact(s=>{const x=s.topics.find(x=>x.id===tid);if(x)x.reasons=html?[html]:[]},'已修改结论原因')}else if(parts[0]==='analysisfeature'){const [,fid]=parts;if(!html)return;transact(s=>{const t=ensureTopicForFeature(s,fid,false);if(t)t.analysis=[html]},'已修改分析')}else if(parts[0]==='reasonfeature'){const [,fid]=parts;if(!html)return;transact(s=>{const t=ensureTopicForFeature(s,fid,false);if(t)t.reasons=[html]},'已修改结论原因')}}
function openContentManager(initialTab='software'){let tab=initialTab;const draw=()=>{document.getElementById('simpleModalTitle').textContent='内容管理';document.getElementById('simpleModalSave').textContent='完成';document.getElementById('simpleModalBody').innerHTML=`<div class="manager-tabs"><button class="manager-tab ${tab==='software'?'active':''}" data-manager-tab="software">竞品管理</button><button class="manager-tab ${tab==='feature'?'active':''}" data-manager-tab="feature">功能管理</button></div>${tab==='software'?`<p class="manager-section-note">在同一处新增、查看和删除竞品；删除后会同步移除该竞品在全部功能中的对比数据。</p><div class="manager-add"><div class="form-row" style="margin:0"><label>软件名称</label><input class="edit-input" id="mgrSoftName" placeholder="例如：Trimble Access"></div><div class="form-row" style="margin:0"><label>简称</label><input class="edit-input" id="mgrSoftShort" placeholder="Trimble"></div><div class="form-row" style="margin:0"><label>颜色</label><input class="edit-input" id="mgrSoftColor" type="color" value="#64748b"></div><button class="btn primary" id="mgrAddSoft">添加竞品</button></div><div class="manager-list">${state.softwares.map(sw=>`<div class="manager-row"><span class="swatch" style="background:${sw.color}"></span><div class="name">${esc(sw.name)}<small>${esc(sw.short||'')}</small></div>${sw.id==='sm'?`<span class="status-pill">基准软件</span>`:`<button class="btn danger" data-mgr-delete-soft="${sw.id}">删除</button>`}</div>`).join('')}</div>`:`<p class="manager-section-note">在同一处新增、查看和删除功能；普通功能也可维护分析与阶段性结论，并可按需加入重点分析。</p><div class="manager-add feature-add"><div class="form-row" style="margin:0"><label>功能名称</label><input class="edit-input" id="mgrFeatureName" placeholder="例如：道路放样"></div><button class="btn primary" id="mgrAddFeature">添加功能</button></div><div class="manager-list">${state.features.map(f=>{const topic=topicForFeature(f.id);const focused=!!topic&&topic.isFocus!==false;return `<div class="manager-row"><span class="swatch" style="background:${focused?'#2563eb':'#cbd5e1'}"></span><div class="name">${esc(f.name)}<small>${focused?'已纳入重点分析':'普通分析'}</small></div><button class="btn danger" data-mgr-delete-feature="${f.id}">删除</button></div>`}).join('')}</div>`}`;document.querySelectorAll('[data-manager-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.managerTab;draw()});if(tab==='software'){document.getElementById('mgrAddSoft').onclick=()=>{const name=document.getElementById('mgrSoftName').value.trim();if(!name)return;const short=document.getElementById('mgrSoftShort').value.trim()||name;const color=document.getElementById('mgrSoftColor').value;transact(s=>{const id='s'+Date.now();s.softwares.push({id,name,short,color});s.features.forEach(f=>{f.facts[id]=[];f.status[id]='unknown'})},'已新增竞品');filters.softwareIds=new Set(state.softwares.map(s=>s.id));draw()};document.querySelectorAll('[data-mgr-delete-soft]').forEach(b=>b.onclick=()=>{const id=b.dataset.mgrDeleteSoft;const sw=getSoftware(id);if(!sw||!confirm(`删除竞品“${sw.name}”？该软件的全部对比内容会一并删除。`))return;transact(d=>{d.softwares=d.softwares.filter(x=>x.id!==id);d.features.forEach(f=>{delete f.facts[id];delete f.status[id]})},'已删除竞品');filters.softwareIds.delete(id);draw()})}else{document.getElementById('mgrAddFeature').onclick=()=>{const name=document.getElementById('mgrFeatureName').value.trim();if(!name)return;transact(s=>{const id='f'+Date.now();const facts={},status={};s.softwares.forEach(x=>{facts[x.id]=[];status[x.id]='unknown'});s.features.push({id,name,facts,status,related:[]})},'已新增功能');draw()};document.querySelectorAll('[data-mgr-delete-feature]').forEach(b=>b.onclick=()=>{const id=b.dataset.mgrDeleteFeature;const f=getFeature(id);if(!f||!confirm(`删除功能“${f.name}”？`))return;transact(s=>{s.features=s.features.filter(x=>x.id!==id);s.features.forEach(x=>{x.related=(x.related||[]).filter(r=>r!==id)});(s.topics||[]).forEach(t=>{if(Array.isArray(t.relatedFeatures))t.relatedFeatures=t.relatedFeatures.filter(r=>r!==id)})},'已删除功能');expandedFeatures.delete(id);draw()})}};modalSaveHandler=()=>closeModal('simpleModal');document.getElementById('simpleModal').classList.add('show');draw()}
function openSimpleModal(title,body,onSave){document.getElementById('simpleModalSave').textContent='保存';document.getElementById('simpleModalTitle').textContent=title;document.getElementById('simpleModalBody').innerHTML=body;modalSaveHandler=onSave;document.getElementById('simpleModal').classList.add('show')}
function closeModal(id){document.getElementById(id).classList.remove('show')}
function download(name,content,type='text/plain'){const blob=new Blob([content],{type});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
function markdownExport(){let out=`# ${state.meta.title}\n\n> 对比对象：${state.softwares.map(s=>s.name).join('、')}  \n> 分析目标：${state.meta.goal}\n\n---\n\n# 一、功能梳理总览\n\n| 对比项 | ${state.softwares.map(s=>s.name).join(' | ')} |\n|---|${state.softwares.map(()=> '---').join('|')}|\n`;for(const f of state.features){out+=`| **${f.name}** | ${state.softwares.map(s=>(f.facts[s.id]||[]).length?(f.facts[s.id]||[]).map(x=>'• '+richToMarkdown(x)).join('<br>'):'—').join(' | ')} |\n`}out+=`\n> **说明：** “—”表示当前梳理中尚未形成足够明确的对比信息，并不直接等同于软件一定不支持。\n\n---\n\n# 二、重点功能分析\n`;focusTopics().forEach((t,i)=>{out+=`\n## 2.${i+1} ${t.name}\n\n| 软件 | 功能表现 |\n|---|---|\n`;state.softwares.forEach(s=>{const groups=topicFacts(t,s.id);const bs=groups.flatMap(g=>g.bullets);out+=`| **${s.name}** | ${bs.length?bs.map(x=>'• '+richToMarkdown(x)).join('<br>'):'—'} |\n`});out+=`\n**分析：**\n\n`;t.analysis.forEach((a,j)=>out+=`${j+1}. ${richToMarkdown(a)}\n\n`)});out+=`\n---\n\n# 三、阶段性结论\n\n| 重要性 | 方向 | 当前判断 | 主要原因 |\n|---|---|---|---|\n`;conclusionTopics().forEach(t=>out+=`| **${importanceLabel(t)}** | **${t.name}** | **${t.judgement}** | ${t.reasons.map(x=>'• '+richToMarkdown(x)).join('<br>')} |\n`);return out}

document.querySelectorAll('.page-tab[data-view]').forEach(b=>b.onclick=()=>{const v=b.dataset.view;if(v==='analysis'){currentView={type:'topic',id:(currentView.type==='topic'&&currentView.id)||focusTopics()[0]?.id||null}}else currentView={type:v,id:null};render()});document.getElementById('editBtn').onclick=()=>{editMode=!editMode;document.getElementById('editBtn').textContent=editMode?'完成':'编辑';document.getElementById('editBtn').classList.toggle('primary',!editMode);render()};document.getElementById('undoBtn').onclick=undo;document.getElementById('redoBtn').onclick=redo;document.getElementById('exportBtn').onclick=()=>document.getElementById('exportModal').classList.add('show');document.getElementById('contentManagerBtn').onclick=()=>openContentManager('software');bindGlobalRichToolbar();document.getElementById('simpleModalSave').onclick=()=>modalSaveHandler&&modalSaveHandler();document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>b.closest('.modal').classList.remove('show'));document.getElementById('exportJson').onclick=()=>download('SurveyMaster_竞品分析数据.json',JSON.stringify(state,null,2),'application/json');document.getElementById('exportMd').onclick=()=>download('SurveyMaster_竞品功能分析报告_导出.md',markdownExport(),'text/markdown');document.getElementById('importJson').onclick=()=>document.getElementById('importInput').click();document.getElementById('importInput').onchange=e=>{const file=e.target.files[0];if(!file)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.features||!d.softwares)throw Error();undoStack.push(clone(state));state=d;normalizeBuiltins(state);persist();filters.softwareIds=new Set(state.softwares.map(s=>s.id));render();toast('导入成功');closeModal('exportModal')}catch(err){alert('JSON 文件格式不正确')}};r.readAsText(file)};document.getElementById('resetData').onclick=()=>{if(confirm('恢复为本页面初始报告内容？当前协作数据将被覆盖并同步到平台。')){undoStack.push(clone(state));state=clone(INITIAL_DATA);normalizeBuiltins(state);persist();filters.softwareIds=new Set(state.softwares.map(s=>s.id));render();closeModal('exportModal');toast('已恢复初始内容')}};document.addEventListener('keydown',e=>{const editingTarget=e.target.matches?.('input,textarea,[contenteditable=\"true\"]');if(editingTarget)return;if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redo():undo()}else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='y'){e.preventDefault();redo()}});document.addEventListener('click',e=>{if(e.target.classList.contains('modal'))e.target.classList.remove('show')});
bootstrap();
</script>
</body></html>
