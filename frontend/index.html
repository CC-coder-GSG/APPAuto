<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>OmniQA 测试管理系统</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    .text-btn { background:none; border:none; color:#64748b; cursor:pointer; padding:0 4px; font-size:14px; font-weight:bold; }
    .text-btn:hover { color:#dc2626; }
  </style>
</head>
<body>
<div class="toast-wrap" id="toastWrap"></div>
<div class="container">
  <div class="card row" style="justify-content:space-between">
    <div style="display: flex; align-items: center;">
      <img src="/static/omniqa-logo.png" alt="OmniQA" style="height: 36px; margin-right: 12px; border-radius: 4px;">
      <h1 style="margin: 0; color: #1e293b; letter-spacing: 1px;">OmniQA</h1>
    </div>
    <div><span id="me" class="badge"></span> <button class="secondary" onclick="logout()">退出</button></div>
  </div>

  <div class="card row" id="tabs">
    <button id="tabAssignBtn" onclick="showTab('assign')">任务分配台</button>
    <button id="tabMineBtn" onclick="showTab('mine')">我的工作台</button>
    <button onclick="showTab('retest')">复测工作台</button>
    <button onclick="showTab('stage5')">整体测试</button>
    <button onclick="showTab('report')">报表中心</button>
    <button id="tabDataBtn" onclick="showTab('data')">数据管理台</button>
  </div>

  <section id="tab-assign" class="hidden card">
    <h2>任务分配台（仅管理员）</h2>
    <div class="row"><label>大版本</label><select id="assignMajorSelect"></select><button onclick="loadAssignBoard()">加载</button><button onclick="publishAssign()">一键发布/更新分配</button></div>
    <table><thead><tr><th>需求</th><th>负责人</th></tr></thead><tbody id="assignTable"></tbody></table>
  </section>

  <section id="tab-mine" class="card">
    <h2>我的工作台</h2>
    <div class="card" style="background: #f8fafc; border: 1px solid #e2e8f0; margin-bottom: 16px;">
      <div class="row" style="margin-bottom: 12px;">
        <span style="font-weight: bold; color: #334155; margin-right: 8px;">🎯 需求视图:</span>
        <label>大版本</label>
        <select id="mineMajorSelect"></select>
        <button onclick="loadMyWorkbench()">加载我的需求</button>
      </div>
      
      <div class="row" style="border-top: 1px dashed #cbd5e1; padding-top: 12px;">
        <span style="font-weight: bold; color: #334155; margin-right: 8px;">🚀 测试上下文:</span>
        <label>当前执行子版本 (发包)</label>
        <select id="mineMinorSelect"></select>
        <button class="secondary" onclick="pushCase()">推送用例进度</button>
        <button class="secondary" onclick="pushTest()">推送测试进度</button>
      </div>
    </div>
    <div id="mineCards"></div>
  </section>

  <section id="tab-retest" class="hidden card">
    <h2>复测工作台</h2>
    <div class="row"><label>大版本</label><select id="retestMajorSelect"></select><button onclick="loadRetest()">加载</button><button onclick="pushRetest()">📢 推送复测结果</button></div>
    <table><thead><tr><th>需求</th><th>原负责人</th><th>复测</th></tr></thead><tbody id="retestTable"></tbody></table>
  </section>

  <section id="tab-stage5" class="hidden card">
    <h2>整体测试阶段</h2>
    <div class="row"><label>大版本</label><select id="s5MajorSelect"></select><label>子版本</label><select id="s5MinorSelect"></select><button onclick="loadStage5()">加载全景</button><button onclick="pushStage5()">推送整体测试状态</button></div>
    <div id="stage5Req" class="muted"></div>
    <table><thead><tr><th>Bug池</th><th>新Bug</th><th>测试完毕</th></tr></thead><tbody id="s5Table"></tbody></table>
    <h3>➕ 新增问题</h3>
    <div class="row">
      <div class="prefix-input"><span>b#</span><input id="newBugNum" inputmode="numeric" oninput="digitsOnly(this)"></div>
      <select id="newSourceType"><option value="manual">自由问题</option><option value="requirement">需求来源</option><option value="case">用例来源</option><option value="legacy_bug">历史Bug来源</option></select>
      <input id="newSourceRef" placeholder="来源编号(可空)">
      <select id="newReqSelect"><option value="">关联需求(可空)</option></select>
      <button onclick="addIssue()">新增问题</button>
    </div>
  </section>

  <section id="tab-report" class="hidden card">
    <h2>报表中心</h2>
    <div class="row">
      <label>开始日期</label><input type="date" id="reportStartDate">
      <label>结束日期</label><input type="date" id="reportEndDate">
      <span id="reportUserWrap" class="row hidden"><label>人员</label><select id="reportUserSelect"></select></span>
      <button onclick="queryReport()">查询报表</button>
      <button class="secondary" onclick="exportReportPdf()">导出 PDF</button>
    </div>

    <div id="reportContent" class="card">
      <div class="metrics-grid">
        <div class="metric-card"><div class="metric-title">执行/测试过需求总数</div><div class="metric-value" id="mReq">0</div></div>
        <div class="metric-card"><div class="metric-title">创建用例总数</div><div class="metric-value" id="mCase">0</div></div>
        <div class="metric-card"><div class="metric-title">创建Bug总数</div><div class="metric-value" id="mBug">0</div></div>
        <div class="metric-card"><div class="metric-title">复测需求数</div><div class="metric-value" id="mRetest">0</div></div>
        <div class="metric-card"><div class="metric-title">关闭Bug数</div><div class="metric-value" id="mClosed">0</div></div>
      </div>
      <div class="chart-grid">
        <div id="trendChart" class="chart-box"></div>
        <div id="sourcePieChart" class="chart-box"></div>
        <div id="radarChart" class="chart-box"></div>
        <div id="teamCompareChart" class="chart-box"></div>
        <div id="versionBugChart" class="chart-box"></div>
      </div>
    </div>
  </section>

  <section id="tab-data" class="hidden card">
    <h2>数据管理台（仅管理员）</h2>
    <div class="card">
      <h3>新增与导入需求</h3>
      <div class="row">
        <input id="createReqTitle" placeholder="需求标题">
        <div class="prefix-input"><span>r#</span><input id="createReqNo" inputmode="numeric" placeholder="请输入数字" oninput="digitsOnly(this)"></div>
        <select id="createReqMajorSelect"></select>
        <button id="createReqBtn" onclick="createReq()">单条创建</button>
        <button class="secondary" onclick="document.getElementById('importReqFile').click()">批量导入(Excel/CSV)</button>
        <input type="file" id="importReqFile" accept=".xlsx, .xls, .csv" class="hidden" onchange="handleReqFileSelect(event)">
      </div>
      
      <div id="importPreviewArea" class="hidden" style="margin-top: 16px; padding: 16px; background: #f8fafc; border: 1px dashed #94a3b8; border-radius: 8px;">
        <div style="font-weight: bold; margin-bottom: 12px; color: #334155;">📊 导入预览 (共解析到 <span id="previewCount" style="color: #2563eb; font-size: 18px;">0</span> 条有效数据)</div>
        <div style="max-height: 200px; overflow-y: auto; background: #fff; border: 1px solid #cbd5e1; border-radius: 4px; padding: 10px; font-size: 13px; margin-bottom: 12px;" id="previewList"></div>
        <div class="row">
          <label>导入到大版本：</label>
          <select id="importMajorSelect"></select>
          <button onclick="confirmImport()">确认并导入</button>
          <button class="secondary" onclick="cancelImport()" style="background: #94a3b8;">取消</button>
        </div>
      </div>
    </div>

    <div class="card">
      <h3>新增版本</h3>
      <div class="row">
        <input id="createVersionNo" placeholder="版本号 (如 4030 / 40300097)">
        <select id="createVersionType" onchange="toggleCreateVersionParent()"><option value="major">大版本</option><option value="minor">子版本</option></select>
        <select id="createVersionParent" disabled><option value="">父大版本（minor必选）</option></select>
        <button onclick="createVersion()">创建版本</button>
      </div>
    </div>

    <div class="card">
      <h3>新增用户</h3>
      <div class="row">
        <input id="createUsername" placeholder="用户名">
        <input id="createPassword" type="password" placeholder="密码">
        <select id="createUserRole"><option value="user">普通用户</option><option value="admin">管理员</option></select>
        <button onclick="createUser()">创建用户</button>
      </div>
    </div>

    <div class="card">
      <h3>用户管理</h3>
      <div id="dataUsers"></div>
    </div>

    <p class="warn">危险操作：删除大版本会级联删除其下需求/用例/Bug。</p>
    <div class="row" style="justify-content: space-between; align-items: center; margin-top: 24px; margin-bottom: 12px; border-bottom: 2px solid #e2e8f0; padding-bottom: 8px;">
      <h3 style="margin: 0;">🌳 质量资产大盘 (树形追溯)</h3>
      <div>
        <button class="secondary" onclick="exportTreePdf()" style="margin-right: 8px;">导出树状图 (PDF)</button>
        <button onclick="loadDataOverview()">刷新大盘</button>
      </div>
    </div>
    <div id="dataTreeArea"></div>
  </section>
</div>

<script>
const token=localStorage.getItem('token'); if(!token) location.href='/login';
const H={'Authorization':'Bearer '+token,'Content-Type':'application/json'};
let currentUser=null, users=[], versions=[], assignReqs=[], stage5Rows=[];
let trendChart=null, sourcePieChart=null, radarChart=null, teamCompareChart=null, versionBugChart=null;
let reportLoaded=false;

function showMessage(msg,type='success'){const w=document.getElementById('toastWrap');const d=document.createElement('div');d.className=`toast ${type}`;d.innerText=msg;w.appendChild(d);setTimeout(()=>{d.classList.add('hide');setTimeout(()=>d.remove(),220)},3000)}
function digitsOnly(el){el.value=(el.value||'').replace(/\D/g,'')}
function withPrefix(prefix,num){if(!num) return null; return `${prefix}${String(num).replace(/\D/g,'')}`}
function versionTypeZh(v){return v==='major'?'大版本':'子版本'}
function sourceTypeZh(v){const m={manual:'自由问题',case:'用例来源',requirement:'需求来源',legacy_bug:'历史Bug来源'};return m[v]||v}
function logout(){localStorage.removeItem('token');location.href='/login'}
function confirmPush(){return confirm('确定要向企微群发送吗？')}
function showTab(name){
  ['assign','mine','retest','stage5','report','data'].forEach(x=>document.getElementById('tab-'+x).classList.add('hidden'));
  document.getElementById('tab-'+name).classList.remove('hidden');
  if(name==='report'){loadReportOnDemand()}
}
function isAllUsersReport(){return currentUser && currentUser.role==='admin' && reportUserSelect && reportUserSelect.value==='0'}
function adjustReportChartVisibility(){
  const radarEl=document.getElementById('radarChart');
  const teamEl=document.getElementById('teamCompareChart');
  const allUsersMode=isAllUsersReport();
  if(radarEl) radarEl.style.display=allUsersMode?'none':'';
  if(teamEl) teamEl.style.display=allUsersMode?'':'none';
  if(radarChart) radarChart.resize();
  if(teamCompareChart) teamCompareChart.resize();
}
async function loadReportOnDemand(){
  if(!reportLoaded){await queryReport();return}
  adjustReportChartVisibility();
}
function bindReportEvents(){
  const onFilterChange=()=>{if(!document.getElementById('tab-report').classList.contains('hidden')) queryReport()};
  reportStartDate.addEventListener('change',onFilterChange);
  reportEndDate.addEventListener('change',onFilterChange);
  reportUserSelect.addEventListener('change',onFilterChange);
  window.addEventListener('resize',()=>{
    [trendChart,sourcePieChart,radarChart,teamCompareChart,versionBugChart].forEach(c=>c&&c.resize())
  });
}

async function api(url,opt={}){opt.headers={...(opt.headers||{}),Authorization:'Bearer '+token};const r=await fetch(url,opt);if(r.status===401){logout();throw new Error('401')}if(!r.ok){let t='操作失败';try{const j=await r.json();t=j.detail||t}catch{};throw new Error(t)}return r}

async function init(){
  currentUser=await (await api('/auth/me')).json();
  document.getElementById('me').innerText=`${currentUser.username}(${currentUser.role})`;
  const today = new Date().toISOString().slice(0,10);
  document.getElementById('reportStartDate').value=today;
  document.getElementById('reportEndDate').value=today;
  bindReportEvents();

  await loadVersions();
  if(currentUser.role==='admin'){
    await loadUsers();
    document.getElementById('tabAssignBtn').classList.remove('hidden');
    document.getElementById('tabDataBtn').classList.remove('hidden');
    document.getElementById('reportUserWrap').classList.remove('hidden');
    fillReportUsers();
    showTab('assign');
  }else{
    document.getElementById('tabAssignBtn').classList.add('hidden');
    document.getElementById('tabDataBtn').classList.add('hidden');
    showTab('mine');
  }
}

async function loadUsers(){users=await (await api('/users')).json();fillReportUsers()}
function fillReportUsers(){const s=document.getElementById('reportUserSelect');if(!s) return; const allOpt=currentUser&&currentUser.role==='admin'?'<option value="0">全员</option>':''; s.innerHTML=allOpt+users.map(u=>`<option value="${u.id}">${u.username}${u.is_team_member===false?'(编外)':''}</option>`).join('');adjustReportChartVisibility()}

async function loadVersions(){versions=await (await api('/versions')).json();fillVersionSelects();fillCreateVersionParent();toggleCreateVersionParent();updateCreateReqControls()}
function fillVersionSelects(){
  const majors=versions.filter(v=>v.version_type==='major');
  const minors=versions.filter(v=>v.version_type==='minor');
  ['assignMajorSelect','mineMajorSelect','retestMajorSelect','s5MajorSelect','createReqMajorSelect'].forEach(id=>fillSelect(id,majors));
  ['mineMinorSelect','s5MinorSelect'].forEach(id=>fillSelect(id,minors));
}
function fillSelect(id,list){const el=document.getElementById(id); if(!el) return; el.innerHTML=list.map(v=>`<option value='${v.id}'>${v.version_no}</option>`).join('')}
function updateCreateReqControls(){
  const majorSel=document.getElementById('createReqMajorSelect');
  const createBtn=document.getElementById('createReqBtn');
  const importMajorSel=document.getElementById('importMajorSelect');
  if(!majorSel || !createBtn) return;
  const hasMajor=(majorSel.options||[]).length>0;
  majorSel.disabled=!hasMajor;
  createBtn.disabled=!hasMajor;
  createBtn.title=hasMajor?'':'请先去【数据管理台】创建一个大版本！';
  if(importMajorSel) importMajorSel.innerHTML=majorSel.innerHTML;
}

function fillCreateVersionParent(){
  const parentSel=document.getElementById('createVersionParent'); if(!parentSel) return;
  const majors=versions.filter(v=>v.version_type==='major');
  parentSel.innerHTML='<option value="">父大版本（minor必选）</option>'+majors.map(v=>`<option value="${v.id}">${v.version_no}</option>`).join('');
}
function toggleCreateVersionParent(){
  const type=document.getElementById('createVersionType')?.value;
  const parent=document.getElementById('createVersionParent');
  if(!parent) return; parent.disabled = type!=='minor'; if(type!=='minor') parent.value='';
}

async function createVersion(){
  try{
    const version_no=(createVersionNo.value||'').trim();
    const version_type=createVersionType.value;
    const parentRaw=createVersionParent.value;
    const parent_id=version_type==='minor'?Number(parentRaw):null;
    if(!version_no){showMessage('请填写版本号','error');return}
    if(version_type==='minor' && !parentRaw){showMessage('minor 版本必须选择父大版本','error');return}
    await api('/versions',{method:'POST',headers:H,body:JSON.stringify({version_no,version_type,parent_id})});
    createVersionNo.value='';createVersionType.value='major';toggleCreateVersionParent();
    await loadVersions(); await loadDataOverview();
    showMessage('创建版本成功','success');
  }catch(err){showMessage(err.message||'创建版本失败','error')}
}

async function createUser(){
  try{
    const username=(createUsername.value||'').trim();
    const password=(createPassword.value||'').trim();
    const role=createUserRole.value;
    if(!username||!password){showMessage('请填写用户名和密码','error');return}
    await api('/users',{method:'POST',headers:H,body:JSON.stringify({username,password,role})});
    createUsername.value='';createPassword.value='';createUserRole.value='user';
    await loadUsers(); await loadDataOverview();
    showMessage('创建用户成功','success');
  }catch(err){showMessage(err.message||'创建用户失败','error')}
}

async function createReq(){
  try{
    const title=(createReqTitle.value||'').trim();
    const reqNo=withPrefix('r#',createReqNo.value);
    const major_version_id=Number(createReqMajorSelect.value);
    if(!major_version_id){
      showMessage('请先去【数据管理台】创建一个大版本！', 'error');
      return;
    }
    if(!title){showMessage('请填写需求标题','error');return}
    if(!reqNo){showMessage('请填写需求编号数字部分','error');return}
    await api('/requirements',{method:'POST',headers:H,body:JSON.stringify({zentao_req_id:reqNo,title,major_version_id})});
    createReqTitle.value='';createReqNo.value='';
    showMessage('需求已创建成功，请联系管理员分配人员或刷新列表', 'success');
    await loadDataOverview();
  }catch(err){showMessage(err.message||'创建需求失败','error')}
}

/* ================= XLSX / CSV 解析核心逻辑 ================= */
let pendingImportReqs = [];

function handleReqFileSelect(e) {
  const file = e.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = function(evt) {
    try {
      // 1. 获取文件的二进制数据
      const data = new Uint8Array(evt.target.result);
      // 2. 借助 SheetJS 解析 Excel
      const workbook = XLSX.read(data, {type: 'array'});
      const firstSheetName = workbook.SheetNames[0];
      const worksheet = workbook.Sheets[firstSheetName];
      // 3. 将表格转为二维数组，彻底摆脱换行符和逗号的干扰
      const jsonArr = XLSX.utils.sheet_to_json(worksheet, {header: 1});
      
      parseExcelArray(jsonArr);
    } catch(err) {
      showMessage('Excel 解析失败，请检查文件格式是否正确', 'error');
    }
    e.target.value = ''; // 清空 input 允许下次选择同一个文件
  };
  
  // 必须使用 readAsArrayBuffer 才能读取真正的 .xlsx 二进制文件
  reader.readAsArrayBuffer(file); 
}

function parseExcelArray(rows) {
  pendingImportReqs = [];
  let isDataStarted = false;
  let idIndex = -1, titleIndex = -1;

  for (let row of rows) {
    // 忽略空行
    if (!row || row.length === 0) continue;

    if (!isDataStarted) {
      // 自动向下寻找包含“编号”和“需求名称”的真实表头（完美跳过顶部说明）
      idIndex = row.indexOf('编号');
      titleIndex = row.indexOf('需求名称');
      if (idIndex !== -1 && titleIndex !== -1) {
          isDataStarted = true;
      }
      continue;
    }

    // 找到表头后，提取下方的数据
    if (idIndex !== -1 && titleIndex !== -1) {
      const rawId = String(row[idIndex] || '').trim();
      const rawTitle = String(row[titleIndex] || '').trim();
      
      // 提取纯数字作为需求号
      const reqNo = rawId.replace(/\D/g, '');
      if (reqNo && rawTitle) {
        pendingImportReqs.push({ zentao_req_id: 'r#' + reqNo, title: rawTitle });
      }
    }
  }

  if (pendingImportReqs.length === 0) {
    showMessage('未解析到数据，请确保表格中包含"编号"和"需求名称"列头！', 'error');
    return;
  }

  // 渲染预览区
  document.getElementById('importPreviewArea').classList.remove('hidden');
  document.getElementById('previewCount').innerText = pendingImportReqs.length;
  document.getElementById('previewList').innerHTML = pendingImportReqs.map(r => `<div style="padding: 4px 0; border-bottom: 1px solid #f1f5f9;"><span class="badge" style="margin-right:8px">${r.zentao_req_id}</span> ${r.title}</div>`).join('');
  document.getElementById('importMajorSelect').innerHTML = document.getElementById('createReqMajorSelect').innerHTML;
}

function cancelImport() {
  pendingImportReqs = [];
  document.getElementById('importPreviewArea').classList.add('hidden');
}

async function confirmImport() {
  const majorId = Number(document.getElementById('importMajorSelect').value);
  if (!majorId) { showMessage('请选择要导入的大版本！', 'error'); return; }
  
  try {
    const res = await api('/requirements/batch', {
      method: 'POST',
      headers: H,
      body: JSON.stringify({ major_version_id: majorId, items: pendingImportReqs })
    });
    const data = await res.json();
    showMessage(`成功导入 ${data.count} 条新需求（已自动忽略系统中存在的重复项）！`, 'success');
    cancelImport();
    await loadDataOverview();
  } catch (err) {
    showMessage(err.message || '导入失败', 'error');
  }
}
/* ======================================================== */

async function loadAssignBoard(){const majorId=Number(assignMajorSelect.value);assignReqs=await (await api('/requirements?major_version_id='+majorId)).json();assignTable.innerHTML=assignReqs.map(r=>`<tr><td>${r.zentao_req_id} ${r.title}</td><td><select id='o_${r.id}'><option value=''>未分配</option>${users.map(u=>`<option value='${u.id}' ${u.id===r.owner_id?'selected':''}>${u.username}</option>`).join('')}</select></td></tr>`).join('')}
async function publishAssign(){if(!confirmPush()) return;const majorId=Number(assignMajorSelect.value);const assignments=assignReqs.map(r=>({requirement_id:r.id,owner_id:Number(document.getElementById('o_'+r.id).value)||null}));await api('/requirements/assign-and-publish',{method:'POST',headers:H,body:JSON.stringify({major_version_id:majorId,assignments})});showMessage('分配发布成功')}

async function loadMyWorkbench(){
  const majorId=Number(mineMajorSelect.value);
  const data=await (await api('/requirements/my-workbench?major_version_id='+majorId)).json();
  mineCards.innerHTML=data.map(req=>{
    const caseHtml=(req.test_cases||[]).map(c=>`<div class="case-item"><div class="row"><b>${c.zentao_case_id}</b><button onclick="promptCaseBug(${req.id},${c.id})">添加关联Bug</button><button class="danger" onclick="deleteCase(${c.id})">删除用例</button></div><div class="case-bugs">${(c.bugs||[]).map(b=>`<span class="bug-chip">${b.bug_id}</span>`).join('')||'<span class="muted">暂无关联Bug</span>'}</div></div>`).join('');
    const freeBugHtml=(req.free_bugs||[]).map(b=>`<span class="bug-chip">${b.bug_id}</span>`).join('')||'<span class="muted">暂无自由Bug</span>';

  }).join('');
}


async function setReqStatus(reqId, key, checked){
  try{
    if(!checked){
      const ok=confirm(key==='case_completed'?'确认取消【用例完成】状态吗？':'确认取消【测试完成】状态吗？');
      if(!ok){loadMyWorkbench();return}
    }
    const payload={}; payload[key]=checked;
    await api(`/requirements/${reqId}/status`,{method:'PATCH',headers:H,body:JSON.stringify(payload)});
    showMessage('需求状态已更新','success');
  }catch(err){
    showMessage(err.message||'状态更新失败','error');
  }finally{
    loadMyWorkbench();
  }
}

async function queryReport(){
  try{
    const start_date=reportStartDate.value;
    const end_date=reportEndDate.value;
    let url=`/reports/summary?start_date=${start_date}&end_date=${end_date}`;
    if(currentUser.role==='admin' && reportUserSelect.value){url += `&user_id=${reportUserSelect.value}`}
    const data=await (await api(url)).json();
    reportLoaded=true;
    mReq.innerText=data.overview.executed_requirements || 0;
    mCase.innerText=data.overview.created_cases || 0;
    mBug.innerText=data.overview.created_bugs || 0;
    mRetest.innerText=data.overview.retested_reqs || 0;
    mClosed.innerText=data.overview.closed_bugs || 0;

    const x=data.trend.map(i=>i.date);
    const yReq=data.trend.map(i=>i.executed_requirements);
    const yCase=data.trend.map(i=>i.created_cases);
    const yBug=data.trend.map(i=>i.created_bugs);
    const yRetest=data.trend.map(i=>i.retested_reqs||0);
    const yClosed=data.trend.map(i=>i.closed_bugs||0);

    if(!trendChart){trendChart=echarts.init(document.getElementById('trendChart'))}
    trendChart.setOption({
      title:{text:'趋势折线图'},
      tooltip:{trigger:'axis'},
      legend:{data:['执行需求','创建用例','创建Bug','复测需求','关闭Bug']},
      xAxis:{type:'category',data:x},
      yAxis:{type:'value'},
      series:[
        {name:'执行需求',type:'line',data:yReq,smooth:true},
        {name:'创建用例',type:'line',data:yCase,smooth:true},
        {name:'创建Bug',type:'line',data:yBug,smooth:true},
        {name:'复测需求',type:'line',data:yRetest,smooth:true},
        {name:'关闭Bug',type:'line',data:yClosed,smooth:true},
      ]
    });

    if(!sourcePieChart){sourcePieChart=echarts.init(document.getElementById('sourcePieChart'))}
    sourcePieChart.setOption({
      title:{text:'Bug来源分布',left:'center'},
      tooltip:{trigger:'item'},
      series:[{type:'pie',radius:'60%',data:(data.bug_source_dist||[]).map(i=>({name:sourceTypeZh(i.source_type),value:i.count}))}]
    });

    if(!radarChart){radarChart=echarts.init(document.getElementById('radarChart'))}
    radarChart.setOption({
      title:{text:'个人能力雷达图'},
      tooltip:{},
      radar:{indicator:[
        {name:'执行需求',max:Math.max(10, Number(mReq.innerText)||0)},
        {name:'创建用例',max:Math.max(10, Number(mCase.innerText)||0)},
        {name:'创建Bug',max:Math.max(10, Number(mBug.innerText)||0)},
        {name:'复测需求',max:Math.max(10, Number(mRetest.innerText)||0)},
        {name:'关闭Bug',max:Math.max(10, Number(mClosed.innerText)||0)},
      ]},
      series:[{type:'radar',data:[{value:[Number(mReq.innerText)||0,Number(mCase.innerText)||0,Number(mBug.innerText)||0,Number(mRetest.innerText)||0,Number(mClosed.innerText)||0],name:'指标'}]}]
    });

    if(!teamCompareChart){teamCompareChart=echarts.init(document.getElementById('teamCompareChart'))}
    const team=(data.team_comparison||[])
    teamCompareChart.setOption({
      title:{text:'团队对比（全员模式）'},
      tooltip:{trigger:'axis'},
      legend:{data:['执行需求','创建用例','创建Bug','复测需求','关闭Bug']},
      xAxis:{type:'category',data:team.map(i=>i.username)},
      yAxis:{type:'value'},
      series:[
        {name:'执行需求',type:'bar',data:team.map(i=>i.executed_requirements||0)},
        {name:'创建用例',type:'bar',data:team.map(i=>i.created_cases||0)},
        {name:'创建Bug',type:'bar',data:team.map(i=>i.created_bugs||0)},
        {name:'复测需求',type:'bar',data:team.map(i=>i.retested_reqs||0)},
        {name:'关闭Bug',type:'bar',data:team.map(i=>i.closed_bugs||0)},
      ]
    });

    const vb=await (await api('/reports/version-bugs')).json();
    if(!versionBugChart){versionBugChart=echarts.init(document.getElementById('versionBugChart'))}
    versionBugChart.setOption({
      title:{text:'版本Bug分布'},
      tooltip:{trigger:'axis'},
      xAxis:{type:'category',data:vb.map(i=>i.version_name)},
      yAxis:{type:'value'},
      series:[{name:'Bug数',type:'bar',data:vb.map(i=>i.bug_count)}]
    });
    adjustReportChartVisibility();

    showMessage('报表查询成功','success');
  }catch(err){showMessage(err.message||'查询报表失败','error')}
}

function exportTreePdf() {
  const treeArea = document.getElementById('dataTreeArea');
  if (!treeArea || treeArea.innerText.includes('暂无数据')) {
    showMessage('当前没有可导出的数据！', 'error');
    return;
  }

  showMessage('正在展开数据并生成 PDF，请稍候...', 'success');

  // 1. 魔法操作：在导出前，找到大盘里所有被隐藏的抽屉（包含 major_body 和 req_body）并强制展开
  const hiddenElements = treeArea.querySelectorAll('.hidden');
  hiddenElements.forEach(el => el.classList.remove('hidden'));

  // 2. 配置 PDF 生成参数
  const opt = {
    margin:       0.3,
    filename:     '质量资产树状追溯大盘.pdf',
    image:        { type: 'jpeg', quality: 0.98 },
    html2canvas:  { scale: 2, useCORS: true, backgroundColor: '#ffffff' },
    jsPDF:        { unit: 'in', format: 'a4', orientation: 'portrait' }
  };

  // 3. 执行导出
  html2pdf().set(opt).from(treeArea).save().then(() => {
    showMessage('PDF 导出成功！', 'success');
    // 4. 导出完毕后，重新加载一次大盘，让卡片恢复默认的折叠清爽状态
    loadDataOverview();
  }).catch(err => {
    showMessage('导出失败，请重试', 'error');
    loadDataOverview(); // 出错也恢复状态
  });
}

async function loadDataOverview(){
  const data=await (await api('/admin/data-overview')).json();
  
  // 1. 用户部分保持原样
  dataUsers.innerHTML=(data.users||[]).map(u=>`<div class='row'><span>${u.username}（${u.role==='admin'?'管理员':'普通用户'}）</span><span class='badge' style='background:${u.is_team_member?'#dcfce7':'#fee2e2'};color:${u.is_team_member?'#166534':'#991b1b'}'>${u.is_team_member?'组员':'编外'}</span><button onclick='toggleRole(${u.id},"${u.role}")'>设为${u.role==='admin'?'普通用户':'管理员'}</button><button class='secondary' onclick='toggleTeamMember(${u.id}, ${u.is_team_member ? false : true})'>${u.is_team_member?'设为编外人员':'设为组员'}</button><button class='danger' onclick='removeUser(${u.id},"${u.username}")'>删除</button></div>`).join('');

  // 2. 组装树形追溯视图
  const majors = (data.versions||[]).filter(v=>v.version_type==='major');
  const minors = (data.versions||[]).filter(v=>v.version_type==='minor');
  const minorMap = {}; 
  minors.forEach(m => minorMap[m.id] = m.version_no);

  let treeHtml = '';
  majors.forEach(major => {
    const majorMinors = minors.filter(m => m.parent_id === major.id);
    const reqs = (data.requirements||[]).filter(r => r.major_version_id === major.id);

    // 渲染小版本标签
    let minorHtml = majorMinors.map(m => `<span class="badge" style="background:#e0f2fe;color:#0369a1;margin-right:8px;padding-right:2px;">🏷️ ${m.version_no} <button class="text-btn" title="编辑" onclick="editVersion(${m.id},'${m.version_no}','minor',${major.id})">✎</button><button class="text-btn" title="删除" onclick="removeVersion(${m.id})">×</button></span>`).join('');
    if(!minorHtml) minorHtml = '<span class="muted" style="font-size:13px;">暂无发包记录</span>';

    // 渲染需求列表
    let reqHtml = reqs.map(req => {
        const reqBugs = (data.bugs||[]).filter(b => b.requirement_id === req.id);
        const freeBugs = reqBugs.filter(b => b.source_type === 'manual');
        const caseBugs = reqBugs.filter(b => b.source_type === 'case');

        // 区块A：用例及关联Bug
        let casesListHtml = (req.case_ids||[]).map(cId => {
            const relatedBugs = caseBugs.filter(b => b.source_ref === cId);
            let bHtml = relatedBugs.map(b => `<div style="margin-left:24px; color:#475569; font-size:13px; margin-top:4px;">↳ 🐛 关联 Bug: <b>${b.bug_id}</b> <span style="color:#94a3b8">[发包: 🏷️ ${minorMap[b.minor_version_id]||'未知'}]</span> <button class="text-btn" onclick="editBug(${b.id},'${b.bug_id}')">✎</button><button class="text-btn" onclick="removeBug(${b.id})">×</button></div>`).join('');
            if(!bHtml) bHtml = `<div style="margin-left:24px; color:#10b981; font-size:13px; margin-top:4px;">↳ ✓ 完美通过，无关联Bug</div>`;
            return `<div style="margin-top:12px;">🧪 <b>用例 [${cId}]</b> ${bHtml}</div>`;
        }).join('');

        // 区块B：自由Bug
        let freeBugsHtml = freeBugs.map(b => `<div style="margin-left:24px; color:#475569; font-size:13px; margin-top:4px;">↳ 🐛 自由 Bug: <b>${b.bug_id}</b> <span style="color:#94a3b8">[发包: 🏷️ ${minorMap[b.minor_version_id]||'未知'}]</span> <button class="text-btn" onclick="editBug(${b.id},'${b.bug_id}')">✎</button><button class="text-btn" onclick="removeBug(${b.id})">×</button></div>`).join('');

        return `
        <div style="border:1px solid #e2e8f0; border-radius:6px; margin-bottom:12px; background:#fff;">
          <div style="padding:10px 12px; cursor:pointer; background:#f8fafc; border-bottom:1px solid #e2e8f0; display:flex; justify-content:space-between; align-items:center;" onclick="document.getElementById('req_body_${req.id}').classList.toggle('hidden')">
            <span style="font-size:14px;">📄 <b>${req.zentao_req_id}</b> ${req.title}</span>
            <span>
              <button class="secondary" style="padding:4px 8px; font-size:12px;" onclick="event.stopPropagation(); editReq(${req.id},'${req.zentao_req_id}','${req.title}',${major.id})">编辑</button>
              <button class="danger" style="padding:4px 8px; font-size:12px;" onclick="event.stopPropagation(); removeReq(${req.id})">删除</button>
            </span>
          </div>
          <div id="req_body_${req.id}" class="hidden" style="padding:12px; background:#fff;">
            <div style="margin-bottom:16px;">
              <div style="font-weight:bold; color:#334155; border-bottom:1px solid #f1f5f9; padding-bottom:4px;">[区块 A：测试用例与关联 Bug]</div>
              ${casesListHtml||'<div class="muted" style="margin-left:24px; margin-top:8px;">暂无用例</div>'}
            </div>
            <div>
              <div style="font-weight:bold; color:#334155; border-bottom:1px solid #f1f5f9; padding-bottom:4px;">[区块 B：自由 Bug 池]</div>
              ${freeBugsHtml||'<div class="muted" style="margin-left:24px; margin-top:8px;">暂无自由Bug</div>'}
            </div>
          </div>
        </div>`;
    }).join('');

    if(!reqHtml) reqHtml = '<div class="muted" style="font-size:13px;">暂无下辖需求</div>';

    // 拼装大版本卡片
    treeHtml += `
    <div style="border:2px solid #cbd5e1; border-radius:8px; margin-bottom:16px; background:#fff; overflow:hidden;">
      <div style="padding:12px 16px; background:#f1f5f9; border-bottom:1px solid #cbd5e1; cursor:pointer; display:flex; justify-content:space-between; align-items:center;" onclick="document.getElementById('major_body_${major.id}').classList.toggle('hidden')">
        <span style="font-size:16px; font-weight:bold; color:#0f172a;">📦 大版本：${major.version_no}</span>
        <span>
          <button class="secondary" onclick="event.stopPropagation(); editVersion(${major.id},'${major.version_no}','major',null)">编辑版本</button>
          <button class="danger" onclick="event.stopPropagation(); removeVersion(${major.id})">删除整体</button>
        </span>
      </div>
      <div id="major_body_${major.id}" class="hidden" style="padding:16px; background:#f8fafc;">
        <div style="margin-bottom:20px; padding-bottom:12px; border-bottom:1px dashed #cbd5e1;">
          <div style="font-weight:bold; margin-bottom:8px; color:#334155;">【版本发包履历】</div>
          <div>${minorHtml}</div>
        </div>
        <div>
          <div style="font-weight:bold; margin-bottom:12px; color:#334155;">【下辖需求清单】</div>
          ${reqHtml}
        </div>
      </div>
    </div>`;
  });

  document.getElementById('dataTreeArea').innerHTML = treeHtml || '<div class="muted" style="padding: 20px; text-align: center;">系统中暂无数据，请先创建大版本</div>';
}

async function removeReq(id){if(!confirm('确定删除该需求及其用例/执行记录吗？'))return;await api('/requirements/'+id,{method:'DELETE'});showMessage('需求已删除');loadDataOverview()}
async function removeBug(id){if(!confirm('确定删除该Bug吗？'))return;await api('/bugs/'+id,{method:'DELETE'});showMessage('Bug已删除');loadDataOverview()}
async function editVersion(id,no,type,parent){const newNo=prompt('版本号',no);if(!newNo)return;await api('/versions/'+id,{method:'PUT',headers:H,body:JSON.stringify({version_no:newNo,version_type:type,parent_id:parent})});showMessage('版本已更新');loadVersions();loadDataOverview()}
async function editReq(id,z,title,major){const zNum=prompt('需求号数字部分',z.replace('r#',''));if(!zNum)return;const t=prompt('需求标题',title);if(!t)return;await api('/requirements/'+id,{method:'PUT',headers:H,body:JSON.stringify({zentao_req_id:withPrefix('r#',zNum),title:t,major_version_id:major})});showMessage('需求已更新');loadDataOverview()}
async function editBug(id,b){const num=prompt('Bug数字部分',b.replace('b#',''));if(!num)return;await api('/bugs/'+id+'?new_bug_id='+encodeURIComponent(withPrefix('b#',num)),{method:'PUT'});showMessage('Bug已更新');loadDataOverview()}

window.addEventListener('error',e=>showMessage(e.message||'未知错误','error'))
init().catch(err=>showMessage(err.message,'error'));
</script>
